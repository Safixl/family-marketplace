server:
  port: 8080

spring:
  application:
    name: family-marketplace
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/familymarket}
    username: ${DB_USER:familymarket}
    password: ${DB_PASSWORD:familymarket}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-in-production-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO