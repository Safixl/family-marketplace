server:
  port: 8080

spring:
  application:
    name: family-marketplace
  config:
    # Локальные креды БД читаются из backend/.env (файл в .gitignore, не попадает в git)
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/familymarket}
    username: ${DB_USER:familymarket}
    password: ${DB_PASSWORD:familymarket}
    hikari:
      minimum-idle: 2
      # Защита от «зависших» соединений после сна ОС / перезапуска PostgreSQL:
      # мёртвые TCP-соединения выбиваются keepalive-пингами и лимитом жизни.
      connection-timeout: 15000
      validation-timeout: 5000
      max-lifetime: 600000
      keepalive-time: 30000
      # Логировать соединения, удерживаемые дольше 30 сек (помогает ловить утечки)
      leak-detection-threshold: 30000
      data-source-properties:
        tcpKeepAlive: true
        # Прерывать JDBC-запрос, висящий дольше 60 сек (секунды для pgjdbc)
        socketTimeout: 60
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-in-production-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,https://*.cloudpub.ru}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO